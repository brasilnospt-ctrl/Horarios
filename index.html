<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Os meus horários</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d2330;--mu:#667085;--bd:#e3e1da;--ac:#1f4fd8;--c1:#2563eb;--c2:#ea7a12;--c3:#16a34a;--c4:#9333ea;--bad:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--sf:#1e222b;--tx:#eef0f5;--mu:#9aa3b5;--bd:#2f3440;--ac:#7c9cff;--c1:#6ea0ff;--c2:#ffa24d;--c3:#4ade80;--c4:#c084fc;--bad:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--sf:#1e222b;--tx:#eef0f5;--mu:#9aa3b5;--bd:#2f3440;--ac:#7c9cff;--c1:#6ea0ff;--c2:#ffa24d;--c3:#4ade80;--c4:#c084fc;--bad:#ff7a70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:0 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav{display:flex;gap:6px}
button,select,input{font:inherit;color:inherit}
.b{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 12px;cursor:pointer}
.b:focus-visible,.day:focus-visible,.chip:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wk{font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;position:relative}
.day small{display:block;color:var(--mu);font-size:12px}
.day b{font-size:17px}
.day.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.day.sel small{color:#ffffffcc}
.day.today b{text-decoration:underline}
.dots{display:flex;gap:3px;justify-content:center;height:6px;margin-top:3px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.ev{background:var(--sf);border:1px solid var(--bd);border-left:6px solid var(--k);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.ev.cf{border-color:var(--bad);border-left-color:var(--bad)}
.ev .t{font-weight:600}
.ev .s{color:var(--mu);font-size:14px}
.tm{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:12px;color:var(--k);font-weight:600;margin-right:6px}
.warn{color:var(--bad);font-size:13px;font-weight:600;margin-top:2px}
.bn{background:color-mix(in srgb,var(--bad) 12%,var(--sf));border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.bn small{display:block;font-weight:400;color:var(--mu)}
.pf{display:flex;gap:6px;margin-bottom:12px}.pf select{flex:1}.pf .b{padding:8px 11px}
.bk{margin-top:22px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}.bk .s2{font-size:13px;color:var(--mu);margin:4px 0 10px}.bk .s2.w{color:var(--bad);font-weight:600}.r2{display:flex;gap:8px}.r2 .b{flex:1}
.empty{color:var(--mu);text-align:center;padding:28px 8px;border:1px dashed var(--bd);border-radius:12px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--sf)}
.chip b{color:var(--k)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 4px 14px #0004;cursor:pointer}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sh{background:var(--sf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;margin-top:16px}
.act{flex-wrap:wrap}.act .b{flex:1 1 40%}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.del{color:var(--bad)}
#msg{color:var(--bad);font-size:14px;min-height:18px;margin-top:8px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4fd8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main>
<h1>Os meus horários</h1>
<div class="pf"><select id="pf" aria-label="Perfil"></select><button class="b" id="pn" aria-label="Novo perfil">＋</button><button class="b" id="pr" aria-label="Renomear perfil">✎</button><button class="b" id="pd" aria-label="Apagar perfil">🗑</button></div>
<div class="top">
  <span class="wk" id="wk"></span>
  <div class="nav"><button class="b" id="pv" aria-label="Semana anterior">‹</button><button class="b" id="hj">Hoje</button><button class="b" id="nx" aria-label="Semana seguinte">›</button></div>
</div>
<div class="days" id="days"></div>
<div id="bn"></div><div id="list"></div>
<div class="sum" id="sum"></div>
<div style="color:var(--mu);font-size:13px">Horas desta semana por categoria.</div>
<div class="bk"><b>Cópia de segurança</b><div id="bs" class="s2"></div><div class="r2"><button class="b" id="bx">Guardar cópia</button><button class="b" id="bi">Restaurar cópia</button></div><input type="file" id="bf" style="display:none"></div>
</main>
<button class="fab" id="add">+ Novo horário</button>

<div class="ov" id="ov"><div class="sh" role="dialog" aria-modal="true">
  <b id="ft">Novo horário</b>
  <div id="cpw"><label for="cp">Copiar de um horário já feito (opcional)</label><select id="cp"></select></div>
  <label for="ti">Título</label><input id="ti" placeholder="Ex.: Matemática, Aula de código, Estágio">
  <label for="ca">Categoria</label>
  <select id="ca"><option value="escola">Escola</option><option value="conducao">Escola de condução</option><option value="estagio">Estágio</option><option value="outro">Outro</option><option value="aviso">Sem aulas / greve</option></select>
  <div class="r"><div><label for="hi">Início</label><input type="time" id="hi" value="09:00"></div><div><label for="hf">Fim</label><input type="time" id="hf" value="10:00"></div></div>
  <div class="r"><div><label for="rp">Repetição</label><select id="rp"><option value="w">Todas as semanas</option><option value="d">Só numa data</option></select></div>
  <div><label for="wd" id="wl">Dia da semana</label><select id="wd"></select><input type="date" id="dt" style="display:none"></div></div>
  <label for="pl">Local ou notas (opcional)</label><input id="pl" placeholder="Sala, morada, instrutor...">
  <div id="msg" role="alert"></div>
  <div class="act"><button class="b del" id="de" style="display:none">Apagar</button><button class="b" id="du" style="display:none">Duplicar</button><button class="b" id="ca2">Cancelar</button><button class="b pri" id="sv">Guardar</button></div>
</div></div>

<script>
var CATS={escola:["Escola","var(--c1)"],conducao:["Condução","var(--c2)"],estagio:["Estágio","var(--c3)"],outro:["Outro","var(--c4)"],aviso:["Sem aulas / greve","var(--bad)"]};
var WD=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"],WS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
var ev=[],sel=new Date(),editId=null;
var PR=[],cur="";
try{PR=JSON.parse(localStorage.getItem("horarios_profiles")||"[]")||[]}catch(e){PR=[]}
if(!PR.length)PR=[{id:"p1",name:"Perfil 1"}];
try{cur=localStorage.getItem("horarios_cur")||""}catch(e){}
if(!PR.some(function(p){return p.id===cur}))cur=PR[0].id;
function keyOf(id){return id==="p1"?"horarios_v1":"horarios_p_"+id}
function loadEv(){try{ev=JSON.parse(localStorage.getItem(keyOf(cur))||"[]")||[]}catch(e){ev=[]}}
function savePr(){try{localStorage.setItem("horarios_profiles",JSON.stringify(PR));localStorage.setItem("horarios_cur",cur)}catch(e){}}
loadEv();
var OFF=[["2026-12-08","2026-12-08","Feriado: Imaculada Conceição"],["2026-12-25","2026-12-25","Feriado: Natal"],["2026-12-16","2026-12-31","Férias de Natal"],["2027-01-01","2027-01-01","Feriado: Ano Novo"],["2027-02-08","2027-02-10","Interrupção do Carnaval"],["2027-03-26","2027-03-26","Feriado: Sexta-feira Santa"],["2027-03-22","2027-04-02","Férias da Páscoa"],["2027-05-27","2027-05-27","Feriado: Corpo de Deus"],["2027-06-10","2027-06-10","Feriado: Dia de Portugal"],["2027-06-13","2027-06-13","Feriado municipal de Lisboa: Santo António"]];
function offDay(d){var k=key(d),r=[];OFF.forEach(function(o){if(k>=o[0]&&k<=o[1])r.push(o[2])});return r}
function save(){try{localStorage.setItem(keyOf(cur),JSON.stringify(ev))}catch(e){}bkStat()}
var $=function(i){return document.getElementById(i)};
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function wdOf(d){return (d.getDay()+6)%7}
function monday(d){var m=new Date(d);m.setHours(12,0,0,0);m.setDate(m.getDate()-wdOf(m));return m}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function forDay(d){var k=key(d),w=wdOf(d);return ev.filter(function(e){return e.rep==="w"?e.wd===w:e.date===k}).sort(function(a,b){return mins(a.s)-mins(b.s)})}
function clash(a,b){return mins(a.s)<mins(b.e)&&mins(b.s)<mins(a.e)}
function conflicts(list){var m={};list.forEach(function(a){list.forEach(function(b){if(a!==b&&clash(a,b)){(m[a.id]=m[a.id]||[]).push(b.t)}})});return m}
function render(){
  var mo=monday(sel),su=addD(mo,6),f=function(d){return d.getDate()+"/"+(d.getMonth()+1)};
  $("wk").textContent="Semana "+f(mo)+" a "+f(su);
  var h="",tk=key(new Date()),tot={escola:0,conducao:0,estagio:0,outro:0};
  for(var i=0;i<7;i++){var d=addD(mo,i),all=forDay(d),l=all.filter(function(e){return e.c!=="aviso"}),off=offDay(d).length>0||all.length!==l.length,cs=conflicts(l),cats={};
    l.forEach(function(e){cats[e.c]=1;if(!(off&&e.c==="escola"))tot[e.c]+=(mins(e.e)-mins(e.s))/60});
    var dots=Object.keys(cats).map(function(c){return '<i style="background:'+CATS[c][1]+'"></i>'}).join("");
    if(Object.keys(cs).length)dots+='<i style="background:var(--bad)"></i>';
    if(off)dots+='<i style="background:var(--mu)"></i>';
    h+='<button class="day'+(key(d)===key(sel)?" sel":"")+(key(d)===tk?" today":"")+'" data-d="'+key(d)+'"><small>'+WS[i]+'</small><b>'+d.getDate()+'</b><div class="dots">'+dots+'</div></button>'}
  $("days").innerHTML=h;
  var all=forDay(sel),l=all.filter(function(e){return e.c!=="aviso"}),cs=conflicts(l),bn=offDay(sel).map(function(t){return {t:t}}).concat(all.filter(function(e){return e.c==="aviso"}).map(function(e){return {t:e.t,id:e.id,p:e.p}}));
  $("bn").innerHTML=bn.map(function(b){return '<div class="bn"'+(b.id?' data-id="'+b.id+'" style="cursor:pointer"':"")+'>'+esc(b.t)+(b.p?'<small>'+esc(b.p)+'</small>':"")+'</div>'}).join("");
  $("list").innerHTML=l.length?l.map(function(e){var c=CATS[e.c],w=cs[e.id];
    return '<div class="ev'+(w?" cf":"")+'" style="--k:'+c[1]+'" data-id="'+e.id+'"><div><div class="t">'+esc(e.t)+'</div><div class="s"><span class="tag">'+c[0]+'</span>'+esc(e.p||"")+(e.rep==="d"?" · data única":"")+'</div>'+(w?'<div class="warn">Sobrepõe-se com: '+esc(w.join(", "))+'</div>':"")+'</div><div class="tm">'+e.s+'<br>'+e.e+'</div></div>'}).join(""):'<div class="empty">Sem horários neste dia. Toque em “Novo horário” para adicionar.</div>';
  $("sum").innerHTML=Object.keys(tot).filter(function(c){return tot[c]>0}).map(function(c){return '<span class="chip" style="--k:'+CATS[c][1]+'">'+CATS[c][0]+' <b>'+(Math.round(tot[c]*10)/10)+' h</b></span>'}).join("")||'<span class="chip">0 h</span>';
}
function openF(e){
  editId=e?e.id:null;$("ft").textContent=e?"Editar horário":"Novo horário";
  $("ti").value=e?e.t:"";$("ca").value=e?e.c:"escola";$("hi").value=e?e.s:"09:00";$("hf").value=e?e.e:"10:00";
  $("rp").value=e?e.rep:"w";$("wd").value=e?(e.wd!=null?e.wd:wdOf(sel)):wdOf(sel);$("dt").value=e&&e.date?e.date:key(sel);$("pl").value=e?e.p||"":"";
  $("de").style.display=e?"block":"none";$("du").style.display=e?"block":"none";$("cpw").style.display=e?"none":"block";fillCp();$("msg").textContent="";tg();$("ov").classList.add("on");
}
function fillCp(){var o='<option value="">Começar do zero</option>';ev.slice().sort(function(a,b){return (a.t>b.t)-(a.t<b.t)}).forEach(function(x){o+='<option value="'+x.id+'">'+esc(x.t.length>34?x.t.slice(0,34)+"…":x.t)+" · "+(x.rep==="w"?WS[x.wd]:x.date)+" "+x.s+"–"+x.e+'</option>'});$("cp").innerHTML=o}
$("cp").onchange=function(){var x=ev.filter(function(y){return y.id===$("cp").value})[0];if(!x)return;$("ti").value=x.t;$("ca").value=x.c;$("hi").value=x.s;$("hf").value=x.e;$("rp").value=x.rep;if(x.wd!=null)$("wd").value=x.wd;if(x.date)$("dt").value=x.date;$("pl").value=x.p||"";tg()};
$("du").onclick=function(){editId=null;$("ft").textContent="Nova cópia: muda o que quiseres";$("de").style.display="none";$("du").style.display="none"};
function tg(){var w=$("rp").value==="w";$("wd").style.display=w?"block":"none";$("dt").style.display=w?"none":"block";$("wl").textContent=w?"Dia da semana":"Data"}
$("wd").innerHTML=WD.map(function(n,i){return '<option value="'+i+'">'+n+'</option>'}).join("");
$("rp").onchange=tg;
$("add").onclick=function(){openF(null)};
$("ca2").onclick=function(){$("ov").classList.remove("on")};
$("sv").onclick=function(){
  var t=$("ti").value.trim(),s=$("hi").value,e=$("hf").value,rep=$("rp").value;
  if(!t){$("msg").textContent="Escreva um título.";return}
  if(!s||!e||mins(e)<=mins(s)){$("msg").textContent="A hora de fim tem de ser depois do início.";return}
  if(rep==="d"&&!$("dt").value){$("msg").textContent="Escolha a data.";return}
  var o={id:editId||String(Date.now()),t:t,c:$("ca").value,s:s,e:e,rep:rep,p:$("pl").value.trim()};
  if(rep==="w")o.wd=+$("wd").value;else o.date=$("dt").value;
  if(editId)ev=ev.map(function(x){return x.id===editId?o:x});else ev.push(o);
  save();$("ov").classList.remove("on");render();
};
$("de").onclick=function(){ev=ev.filter(function(x){return x.id!==editId});save();$("ov").classList.remove("on");render()};
$("ov").onclick=function(e){if(e.target===$("ov"))$("ov").classList.remove("on")};
$("days").onclick=function(e){var b=e.target.closest(".day");if(b){var p=b.dataset.d.split("-");sel=new Date(+p[0],+p[1]-1,+p[2],12);render()}};
$("list").onclick=function(e){var b=e.target.closest(".ev");if(b)openF(ev.filter(function(x){return x.id===b.dataset.id})[0])};
$("pv").onclick=function(){sel=addD(sel,-7);render()};
$("nx").onclick=function(){sel=addD(sel,7);render()};
$("hj").onclick=function(){sel=new Date();render()};
function fillPf(){$("pf").innerHTML=PR.map(function(p){return '<option value="'+p.id+'"'+(p.id===cur?" selected":"")+'>'+esc(p.name)+'</option>'}).join("");$("pd").disabled=PR.length<2;bkStat()}
function sw(id){cur=id;savePr();loadEv();fillPf();render()}
function curP(){return PR.filter(function(x){return x.id===cur})[0]}
$("pf").onchange=function(){sw(this.value)};
$("pn").onclick=function(){var n=(prompt("Nome do novo perfil:")||"").trim();if(!n)return;var id="u"+Date.now();PR.push({id:id,name:n});sw(id)};
$("pr").onclick=function(){var p=curP(),n=(prompt("Novo nome:",p.name)||"").trim();if(!n)return;p.name=n;savePr();fillPf()};
$("pd").onclick=function(){if(PR.length<2)return;var p=curP();if(!confirm("Apagar o perfil "+p.name+" e todos os horários dele?"))return;try{localStorage.removeItem(keyOf(cur))}catch(e){}PR=PR.filter(function(x){return x.id!==cur});sw(PR[0].id)};
function okEv(e){return e&&typeof e.t==="string"&&/^\d\d:\d\d$/.test(e.s)&&/^\d\d:\d\d$/.test(e.e)&&CATS[e.c]&&(e.rep==="w"||e.rep==="d")}
function allData(){return {app:"horarios",v:1,cur:cur,profiles:PR.map(function(p){var e;if(p.id===cur)e=ev;else{try{e=JSON.parse(localStorage.getItem(keyOf(p.id))||"[]")||[]}catch(x){e=[]}}return {id:p.id,name:p.name,ev:e}})}}
function bkStat(){var t=null;try{t=localStorage.getItem("horarios_lastbk")}catch(e){}var el=$("bs");
if(!t){el.textContent=ev.length?"Ainda não guardaste nenhuma cópia. Se mudares ou formatares o telemóvel, perdes os horários.":"Depois de adicionares os teus horários, guarda uma cópia.";el.className="s2"+(ev.length?" w":"")}
else{var d=new Date(+t),old=(Date.now()-d)/864e5>14;el.textContent="Última cópia: "+d.toLocaleDateString("pt-PT")+(old?" (já passaram mais de 14 dias, guarda outra)":"");el.className="s2"+(old?" w":"")}}
$("bx").onclick=function(){var txt=JSON.stringify(allData()),nm="horarios-"+key(new Date())+".json";
function done(){try{localStorage.setItem("horarios_lastbk",String(Date.now()))}catch(e){}bkStat()}
try{var f=new File([txt],nm,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Cópia dos horários"}).then(done).catch(function(){});return}}catch(e){}
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=nm;document.body.appendChild(a);a.click();a.remove();done()};
$("bi").onclick=function(){$("bf").click()};
$("bf").onchange=function(){var f=this.files[0];this.value="";if(!f)return;var r=new FileReader();r.onload=function(){var o;try{o=JSON.parse(r.result)}catch(e){}
if(!o||o.app!=="horarios"||!Array.isArray(o.profiles)||!o.profiles.length){alert("Este ficheiro não é uma cópia válida desta app.");return}
o.profiles.forEach(function(p){p.ev=(Array.isArray(p.ev)?p.ev:[]).filter(okEv)});
var n=o.profiles.reduce(function(s,p){return s+p.ev.length},0);
if(!confirm("Restaurar "+o.profiles.length+" perfil(is) com "+n+" horários? Isto substitui o que está neste telemóvel."))return;
PR.forEach(function(p){try{localStorage.removeItem(keyOf(p.id))}catch(e){}});
PR=o.profiles.map(function(p){return {id:String(p.id),name:String(p.name||"Perfil")}});
o.profiles.forEach(function(p){try{localStorage.setItem(keyOf(String(p.id)),JSON.stringify(p.ev))}catch(e){}});
cur=PR.some(function(p){return p.id===String(o.cur)})?String(o.cur):PR[0].id;savePr();loadEv();fillPf();render();alert("Cópia restaurada.")};r.readAsText(f)};
fillPf();
$("bn").onclick=function(e){var b=e.target.closest(".bn");if(b&&b.dataset.id)openF(ev.filter(function(x){return x.id===b.dataset.id})[0])};
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
